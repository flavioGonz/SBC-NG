# ============================================================================
#  SBC-NG · stack completo
#
#  Todo lo del borde y nada más: no hay Asterisk, no hay CDR, no hay grabaciones.
#  La base es propia (sbcng): SBC-NG no comparte una sola tabla con la central.
# ============================================================================
name: sbcng

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sbcng}
      POSTGRES_USER: ${DB_USER:-sbcng}
      POSTGRES_PASSWORD: ${DB_PASS:?falta DB_PASS en el .env}
    volumes:
      - sbc_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sbcng}"]
      interval: 10s
      retries: 5

  control-plane:
    build: ../control-plane
    image: sbcng/control-plane:${VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-sbcng}
      DB_USER: ${DB_USER:-sbcng}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      KAMAILIO_RPC: http://kamailio:5060/RPC
      RTPENGINE_HOST: rtpengine
      PUBLIC_IP: ${PUBLIC_IP}
      DOMAIN: ${DOMAIN}
    ports:
      - "3100:3100"

  kamailio:
    build: ../docker/images/kamailio
    image: sbcng/kamailio:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host      # SIP necesita ver las IPs reales, no las de docker
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_URL: postgres://${DB_USER:-sbcng}:${DB_PASS}@127.0.0.1:5432/${DB_NAME:-sbcng}
      PUBLIC_IP: ${PUBLIC_IP}
      DOMAIN: ${DOMAIN}

  rtpengine:
    build: ../docker/images/rtpengine
    image: sbcng/rtpengine:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host      # el RTP no puede pasar por el NAT de docker
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      PORT_MIN: ${RTP_PORT_MIN:-30000}
      PORT_MAX: ${RTP_PORT_MAX:-40000}
      # Transcoding: lo que permite meter WebRTC (Opus) contra un operador que sólo habla G.729
      CODECS: ${CODECS:-PCMU,PCMA,G722,opus,G729}

  coturn:
    build: ../docker/images/coturn
    image: sbcng/coturn:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      TURN_REALM: ${DOMAIN}
      TURN_USER: ${TURN_USER:-sbcng}
      TURN_PASS: ${TURN_PASS:?falta TURN_PASS en el .env}
    profiles: ["turn"]

  wsbridge:
    build: ../docker/images/wsbridge
    image: sbcng/wsbridge:${VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      SIP_HOST: ${PUBLIC_IP}
    profiles: ["webrtc"]

volumes:
  sbc_db:
