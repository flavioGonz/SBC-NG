# ============================================================================
#  SBC-NG · stack completo
#
#  Todo lo del borde y nada más: no hay Asterisk, no hay CDR, no hay grabaciones.
#  La base es propia (sbcng): SBC-NG no comparte una sola tabla con la central.
#
#  Kamailio y rtpengine corren en modo host a propósito: el SIP y el RTP tienen
#  que ver las IPs reales. Si pasaran por el NAT de Docker, el SDP anunciaría la
#  IP del contenedor y el audio no llegaría a ningún lado.
# ============================================================================
name: sbcng

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sbcng}
      POSTGRES_USER: ${DB_USER:-sbcng}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - sbc_db:/var/lib/postgresql/data
    ports:
      # Kamailio corre en modo host, así que necesita llegar a la base por la IP
      # del host. Se publica sólo en loopback: no queda expuesta a la red.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sbcng}"]
      interval: 10s
      retries: 5

  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    image: sbcng/control-plane:${VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    # También en modo host, y no por capricho: el panel muestra las interfaces
    # LAN/WAN del SBC (el RJ45 verde o rojo). Dentro de la red de docker sólo
    # vería su propio veth, que no le sirve a nadie. Además así alcanza a
    # Kamailio y a rtpengine por loopback.
    network_mode: host
    # NET_ADMIN: el panel define el modo de red (router o switch). Sin esto no puede
    # crear el puente, prender el ip_forward ni poner la regla de NAT.
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      # Los motores leen su config UNA vez al arrancar: aplicar = reiniciarlos.
      # El codigo solo puede tocar los contenedores del propio SBC (lista blanca).
      - /var/run/docker.sock:/var/run/docker.sock
      - sbc_conf:/etc/sbcng
    environment:
      PORT: 3100
      CONF_DIR: /etc/sbcng
      COMPOSE_PROJECT: sbcng
      DB_HOST: 127.0.0.1
      DB_NAME: ${DB_NAME:-sbcng}
      DB_USER: ${DB_USER:-sbcng}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      KAMAILIO_RPC: http://127.0.0.1:8088/RPC
      RTPENGINE_HOST: 127.0.0.1
      PUBLIC_IP: ${PUBLIC_IP}
      DOMAIN: ${DOMAIN}

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    image: sbcng/dashboard:${VERSION:-0.1.0}
    restart: unless-stopped
    depends_on: [control-plane]
    # Modo host para llegar al control-plane por loopback (:3100) sin exponerlo:
    # el navegador nunca habla con la API directo, siempre pasa por /backend del panel.
    network_mode: host
    environment:
      PORT: 3001
      # El server standalone de Next escucha en $HOSTNAME. En network_mode host eso
      # hereda el hostname del contenedor (sbcNG-lab), que no resuelve: muere con
      # ENOTFOUND antes de escuchar. Hay que atarlo explicitamente.
      HOSTNAME: 0.0.0.0
      API_URL: http://127.0.0.1:3100

  kamailio:
    build:
      context: .
      dockerfile: images/kamailio/Dockerfile
    image: sbcng/kamailio:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host
    volumes:
      - sbc_conf:/etc/sbcng:ro
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: 127.0.0.1
      DB_NAME: ${DB_NAME:-sbcng}
      DB_USER: ${DB_USER:-sbcng}
      DB_PASS: ${DB_PASS}
      PUBLIC_IP: ${PUBLIC_IP}
      TRUSTED_NET: ${TRUSTED_NET:-}

  # Puente WebRTC-cliente (SIP-over-WSS -> Kamailio). Solo actua si hay troncales
  # mode='webrtc-client'. network_mode host para hablar con Kamailio (127.0.0.1:5060) y
  # rtpengine (127.0.0.1:2223) sin NAT de docker.
  wsbridge:
    build:
      context: images/wsbridge
    image: sbcng/wsbridge:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: 127.0.0.1
      DB_NAME: ${DB_NAME:-sbcng}
      DB_USER: ${DB_USER:-sbcng}
      DB_PASS: ${DB_PASS}
      KAM_HOST: 127.0.0.1
      KAM_PORT: 5060
      RTPE_HOST: 127.0.0.1
      RTPE_PORT: 2223
      LOCAL_SIP_PORT: 5090

  rtpengine:
    build:
      context: .
      dockerfile: images/rtpengine/Dockerfile
    image: sbcng/rtpengine:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host
    volumes:
      - sbc_conf:/etc/sbcng:ro
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      PORT_MIN: ${RTP_PORT_MIN:-30000}
      PORT_MAX: ${RTP_PORT_MAX:-40000}

  coturn:
    build:
      context: .
      dockerfile: images/coturn/Dockerfile
    image: sbcng/coturn:${VERSION:-0.1.0}
    restart: unless-stopped
    network_mode: host
    volumes:
      - sbc_conf:/etc/sbcng:ro
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
      DOMAIN: ${DOMAIN}
      TURN_REALM: ${DOMAIN}
      TURN_USER: ${TURN_USER:-sbcng}
      TURN_PASS: ${TURN_PASS:-}
      TURN_PORT_MIN: ${TURN_PORT_MIN:-49152}
      TURN_PORT_MAX: ${TURN_PORT_MAX:-65535}
    profiles: ["turn"]

volumes:
  sbc_db:
  # Config generada por el panel (rtpengine.env, coturn.env, reglas.cfg, seguridad.cfg).
  sbc_conf:
