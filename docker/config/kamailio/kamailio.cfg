#!KAMAILIO
# ============================================================================
#  SBC-NG · señalización del borde
#
#  Diferencia clave con la versión que vivía dentro de PBX-NG: acá NO hay una
#  central cableada por IP. Las centrales se dan de alta por la API norte
#  (POST /api/v1/attach), que las escribe en dos tablas:
#
#    · dispatcher → a dónde mandamos las llamadas ENTRANTES
#    · address    → de quién aceptamos las llamadas SALIENTES
#
#  El SBC no sabe (ni le importa) qué central tiene detrás: puede ser PBX-NG,
#  un 3CX, un FreePBX o dos centrales a la vez.
# ============================================================================
debug=2
log_stderror=no
memdbg=5
memlog=5
fork=yes
children=4
auto_aliases=no


listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060   # SIP/TCP (móviles y CGNAT: conexión persistente)
listen=tcp:0.0.0.0:8088   # WebSocket SIP (WebRTC); el proxy termina TLS y reenvía ws
tcp_accept_no_cl=yes      # aceptar el GET del handshake WS sin Content-Length
tcp_connection_lifetime=3604

# --- no revelar qué somos ni qué versión corremos ---
server_header="Server: SBC-NG"
user_agent_header="User-Agent: SBC-NG"
server_signature=no

loadmodule "jsonrpcs.so"
loadmodule "xhttp.so"
loadmodule "xhttp_prom.so"   # Prometheus: /metrics (Kamailio 6.x)
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "dispatcher.so"
loadmodule "nathelper.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "rtpengine.so"
loadmodule "websocket.so"
loadmodule "db_postgres.so"
loadmodule "uac.so"
loadmodule "drouting.so"
loadmodule "dialog.so"
loadmodule "sst.so"
loadmodule "acc.so"
loadmodule "secfilter.so"
loadmodule "sqlops.so"
loadmodule "permissions.so"   # la tabla address dice qué IPs son centrales nuestras
loadmodule "secsipid.so"       # STIR/SHAKEN: verificar/firmar el Identity (anti-spoofing)
modparam("secsipid", "cache_dir", "/tmp/secsipid")
modparam("secsipid", "cache_expire", 3600)
modparam("secsipid", "timeout", 5)

# ─── Topology Hiding (topoh): oculta las IPs y rutas internas de la central ───────
# Es la capacidad que técnicamente define a un SBC: cifra Via/Record-Route/Contact/Route
# para que el operador NUNCA vea la topología interna (IPs de la PBX, de los internos).
# Stateless (no guarda estado): bajo riesgo. Gateado por @@TOPOH_DEFINE@@ (env TOPOH=1),
# la clave se autogenera por instalación. mask_ip = la IP pública del borde (a la que el
# otro lado enruta de vuelta, ya que el SBC queda en el camino por Record-Route).
@@TOPOH_DEFINE@@
#!ifdef SBCNG_TOPOH
loadmodule "topoh.so"
modparam("topoh", "mask_key", "@@TOPOH_KEY@@")
modparam("topoh", "mask_ip", "@@PUBLIC_IP@@")
modparam("topoh", "mask_callid", 0)
#!endif

modparam("tm", "failure_reply_mode", 3)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
# transport=7 (datagrama + FIFO + HTTP). Con 6 el modulo carga pero NO inicializa el
# transporte HTTP: toda llamada al /RPC contesta "jsonrpc over http not initialized".
modparam("jsonrpcs", "transport", 7)
modparam("jsonrpcs", "pretty_format", 1)
# --- Prometheus (xhttp_prom): expone las stats internas del motor en /metrics ---
# Se sirve por el mismo xhttp del 8088, pero SOLO a la red interna (ver event_route).
modparam("xhttp_prom", "xhttp_prom_stats", "all")

# --- dispatcher: los destinos salen de la BASE, no de un archivo estático ---
# Así se agrega una central con una llamada a la API, sin tocar el contenedor.
modparam("dispatcher", "db_url", "@@DB_URL@@")
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_threshold", 3)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_mode", 3)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=403;code=404;code=405;code=480;code=486")
# Latencia: el dispatcher mide el RTT del OPTIONS y lo deja en LATENCY (AVG/EST) de cada
# destino. De ahi salen la latencia real y el MOS estimado que muestra el panel.
modparam("dispatcher", "ds_ping_latency_stats", 1)
modparam("dispatcher", "ds_latency_estimator_alpha", 900)

modparam("nathelper", "natping_interval", 0)
modparam("nathelper", "received_avp", "$avp(received)")

# --- anti-flood perimetral ---
#
# Los umbrales (cuantos pedidos tolera una IP, cuanto dura el bloqueo, si se filtran
# los escaneres, si se exige TLS) los define el PANEL, no este archivo. El fragmento
# lo genera el control-plane y el entrypoint garantiza que exista: si nunca se toco
# nada, trae los valores de fabrica y el borde igual se defiende.
# TLS nativo (SIP/TLS 5061 + WSS 8443 con cert propio). Va en la sección global porque
# trae enable_tls, loadmodule tls y listen=tls. Vacío = el proxy termina TLS (sin puertos TLS).
include_file "/etc/kamailio/tls_native.cfg"

include_file "/etc/kamailio/seguridad.cfg"
include_file "/etc/kamailio/stir.cfg"

modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

# --- uac: el SBC se registra contra los operadores (las troncales viven acá) ---
modparam("uac", "reg_db_url", "@@DB_URL@@")
modparam("uac", "reg_contact_addr", "@@SELF_IP@@:5060")
modparam("uac", "reg_timer_interval", 90)
modparam("uac", "reg_retry_interval", 60)
modparam("uac", "reg_keep_callid", 1)
modparam("uac", "reg_random_delay", 5)
modparam("uac", "restore_mode", "none")

# --- LCR: por qué operador sale cada número, con failover ---
modparam("drouting", "db_url", "@@DB_URL@@")
modparam("drouting", "use_domain", 0)
modparam("drouting", "drd_table", "dr_gateways")
modparam("drouting", "drr_table", "dr_rules")
modparam("drouting", "drg_table", "dr_groups")
modparam("drouting", "drl_table", "dr_gw_lists")
modparam("drouting", "attrs_avp", "$avp(dr_attrs)")   # attrs del gateway elegido = tope CAC

# --- dialog: cuenta las llamadas de verdad y mata las zombis ---
modparam("dialog", "enable_stats", 1)
# Kamailio 6.x eliminó dlg_flag: el diálogo se crea/rastrea con dlg_manage() (ya lo llamamos en el INVITE inicial).
# modparam("dialog", "dlg_flag", 4)
modparam("dialog", "default_timeout", 7200)
modparam("dialog", "db_mode", 0)
modparam("dialog", "track_cseq_updates", 1)
modparam("dialog", "profiles_with_value", "cac")   # CAC: cuenta llamadas por troncal

# --- Session Timers (RFC 4028): varios operadores los exigen, y limpian colgadas ---
modparam("sst", "min_se", 90)
modparam("sst", "reject_to_small", 0)
modparam("sst", "enable_stats", 1)
modparam("sst", "sst_flag", 5)

# --- acc: el SBC emite su propio CDR ---
modparam("acc", "early_media", 0)
modparam("acc", "report_cancels", 1)
modparam("acc", "log_flag", 6)
modparam("acc", "log_extra", "src=$fU;dst=$rU;srcip=$si")
# El CDR va tambien a la BASE (tabla acc), no solo al syslog: asi el panel lo puede
# mostrar. db_flag = el mismo flag 6 que ya marca el INVITE (y ahora el BYE).
modparam("acc", "db_url", "@@DB_URL@@")
modparam("acc", "db_flag", 6)
modparam("acc", "db_missed_flag", 7)
# Contabilizar tambien las fallidas/timeout (mismo flag 6): un CDR de borde quiere ver
# los intentos que NO prosperaron — es la mitad de la historia en seguridad.
modparam("acc", "failed_transaction_flag", 6)
modparam("acc", "db_extra", "src=$fU;dst=$rU;srcip=$si")

# --- secfilter: listas de bloqueo (UA, IP, destino) gestionables desde la API ---
modparam("sqlops", "sqlcon", "sbc=>@@DB_URL@@")

modparam("secfilter", "db_url", "@@DB_URL@@")
modparam("secfilter", "table_name", "secfilter")

# --- permissions: qué IPs pueden mandarnos salientes (las llena el attach) ---
modparam("permissions", "db_url", "@@DB_URL@@")
modparam("permissions", "db_mode", 1)

#=== SBCNG-MODS START ===
# Modulos y parametros que se prenden desde el panel (Motor SIP). El entrypoint
# garantiza que el archivo exista —vacio si nadie toco nada—, asi que Kamailio
# arranca igual con panel o sin panel.
include_file "/etc/kamailio/modulos.cfg"
#=== SBCNG-MODS END ===

# Registrar del borde (#182): define SBCNG_REGISTRAR + rutas EDGE_REGISTER/EDGE_LOOKUP
# cuando está activo. Va DESPUÉS de modulos.cfg (usa save/lookup/www_authenticate) y
# ANTES del request_route (que llama a esas rutas gated por #!ifdef). Inerte si off.
include_file "/etc/kamailio/registrar.cfg"

# DIDs entrantes (#159): define SBCNG_DIDS + route[DIDROUTE] cuando hay números con
# destino configurado en /numeros. Inerte si no hay ninguno.
include_file "/etc/kamailio/dids.cfg"

request_route {
    # --- anti-loop: el SBC jamás origina un pedido nuevo hacia sí mismo ---
    if (src_ip == @@SELF_IP@@ && !has_totag()) {
        xlog("L_NOTICE","SBC-NG anti-loop drop $rm ru=$ru si=$si\n");
        exit;
    }

    # --- anti-flood: la red confiable queda exenta; los escáneres llegan con IP real ---
    if (src_ip != myself && src_ip != @@TRUSTED_NET@@) {
        if ($sht(ipban=>$si) != $null) { xdbg("PIKE banned $si\n"); exit; }
        if (!pike_check_req()) { xlog("L_ALERT","PIKE flood $si -> ban\n"); $sht(ipban=>$si) = 1; exit; }
    }

#!ifdef SBCNG_SOLO_TLS
    # El panel exige TLS: la senalizacion en claro desde afuera no entra. Ojo, un
    # telefono viejo que no habla TLS deja de registrar — por eso es una decision
    # explicita y no un default.
    if (proto != TLS && src_ip != myself && src_ip != @@TRUSTED_NET@@) {
        xlog("L_NOTICE","SBC-NG rechazado sin TLS si=$si proto=$pr\n");
        sl_send_reply("403", "TLS required"); exit;
    }
#!endif

    if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
    if (!sanity_check("1511", "7")) { xlog("mensaje malformado de $si:$sp\n"); exit; }

    # --- fraude: INVITE de afuera a un destino tipo PSTN sin ser una central nuestra ---
    if (is_method("INVITE") && !has_totag() && !allow_source_address("1")
        && src_ip != myself && src_ip != @@TRUSTED_NET@@
        && ($rU =~ "^[0-9]{7,}$" || $rU =~ "^[+]" || $rU =~ "^00")) {
        xlog("L_NOTICE","SBC-NG drop escaneo PSTN num=$rU si=$si\n");
        $sht(ipban=>$si) = 1;
        sl_send_reply("404", "Not Found");
        exit;
    }
    if (is_method("INVITE") && !has_totag() && $rU =~ "^[0-9]{14,}$") {
        xlog("L_NOTICE","SBC-NG drop toll-fraud num=$rU si=$si\n");
        if (src_ip != myself && src_ip != @@TRUSTED_NET@@) { $sht(ipban=>$si) = 1; }
        sl_send_reply("404", "Not Found");
        exit;
    }

#!ifdef SBCNG_SECFILTER
    # --- secfilter: IP en lista negra ---
    if (src_ip != myself && src_ip != @@TRUSTED_NET@@ && !secf_check_ip()) {
        xlog("L_NOTICE","SBC-NG secfilter IP bloqueada si=$si\n");
        sl_send_reply("403", "Forbidden"); exit;
    }
    # --- secfilter: User-Agent de escáner conocido ---
    if (!secf_check_ua()) {
        xlog("L_NOTICE","SBC-NG secfilter UA bloqueado si=$si ua=$ua\n");
        if (src_ip != myself && src_ip != @@TRUSTED_NET@@) { $sht(ipban=>$si) = 1; }
        sl_send_reply("403", "Forbidden"); exit;
    }
#!endif

    # --- inyección SIP ---
    if ($fU =~ "[';\"]" || $rU =~ "[';\"]") {
        xlog("L_NOTICE","SBC-NG drop inyeccion SIP si=$si fU=$fU rU=$rU\n");
        if (src_ip != myself && src_ip != @@TRUSTED_NET@@) { $sht(ipban=>$si) = 1; }
        sl_send_reply("403", "Forbidden"); exit;
    }

#=== SBCNG-ROUTE START ===
    # Geo-bloqueo por país (geoip2). El fragmento lo genera el panel; si geoip2 está
    # apagado o no hay países, route[GEOBLOCK] sólo hace return (inerte).
    route(GEOBLOCK);
#=== SBCNG-ROUTE END ===

#!ifdef SBCNG_REGISTRAR
    # Registrar del borde: el REGISTER se autentica y termina acá (no se relaya a la
    # central). EDGE_REGISTER hace return si no es REGISTER, así el resto sigue igual.
    route(EDGE_REGISTER);
#!endif

    # --- in-dialog ---
    if (has_totag()) {
        if (loose_route()) {
            handle_ruri_alias();
            if (uri == myself) {
                if (is_method("ACK")) { xlog("L_WARN","SBC-NG drop ACK self-loop (lr)\n"); exit; }
                if (is_method("BYE")) { setflag(6); rtpengine_delete(); }
                if (!ds_select_dst("1", "4")) { sl_send_reply("404", "Not Found"); exit; }
                route(RELAY); exit;
            }
            if (is_method("INVITE")) rtpengine_manage("replace-origin replace-session-connection");
            if (is_method("BYE")) { setflag(6); rtpengine_delete(); }
            route(RELAY);
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) { route(RELAY); }
                else {
                    handle_ruri_alias();
                    if (uri == myself) { xlog("L_WARN","SBC-NG drop ACK self-loop ru=$ru\n"); exit; }
                    route(RELAY);
                }
                exit;
            }
            # UA que no respeta Record-Route: su BYE llega sin Route. Se rutea igual, no se 404ea.
            if (is_method("BYE")) { setflag(6); rtpengine_delete(); }
            if (!handle_ruri_alias()) { if (!ds_select_dst("1", "4")) { sl_send_reply("404", "Not Found"); exit; } }
            route(RELAY);
        }
        exit;
    }

    # --- control de sesión: dialog + accounting + session timers en el INVITE inicial ---
    if (is_method("INVITE") && !has_totag()) { setflag(4); setflag(5); setflag(6); dlg_manage(); }

    # --- SALIENTE: INVITE que viene de UNA DE NUESTRAS CENTRALES -> operador, con failover ---
    #
    # Acá está el corte con la versión vieja: antes era `src_ip == <IP de la única central>`.
    # Ahora es "cualquier IP del grupo 1 de la tabla address", que es lo que llena el attach.
    # Por eso el SBC puede estar delante de PBX-NG, de un 3CX, o de las dos a la vez.
    if (is_method("INVITE") && !has_totag() && allow_source_address("1") && !($ru =~ "alias=")) {
        if (do_routing("0")) {
            xlog("L_INFO","SBC-NG LCR num=$rU -> ru=$ru du=$du\n");
            # --- CAC: tope de llamadas simultaneas por troncal (0 = sin limite) ---
            $var(cacmax) = 0;
            if ($avp(dr_attrs) != $null) { $var(cacmax) = $(avp(dr_attrs){s.int}); }
            if ($var(cacmax) > 0) {
                $var(caccur) = 0;
                get_profile_size("cac", "$rd", "$var(caccur)");
                if ($var(caccur) >= $var(cacmax)) {
                    xlog("L_WARN","SBC-NG CAC troncal $rd llena ($var(caccur)/$var(cacmax)) num=$rU\n");
                    sl_send_reply("503", "Trunk at capacity");
                    exit;
                }
                set_dlg_profile("cac", "$rd");
            }
            t_on_failure("OUTBOUND_FAILOVER");
            route(TOPOHIDE); route(SIPMANIP);
#!ifdef SBCNG_STIR_SIGN
            route(STIRSIGN);
#!endif
            record_route_advertised_address("@@PUBLIC_IP@@");
            rtpengine_manage("trust-address replace-origin replace-session-connection");
            route(RELAY);
            exit;
        }
        xlog("L_WARN","SBC-NG LCR sin operador para num=$rU\n");
        sl_send_reply("404", "No route to PSTN");
        exit;
    }

    # --- destino = teléfono NATeado registrado (R-URI con alias) ---
    if (!is_method("REGISTER") && $ru =~ "alias=") {
        $var(webrtc) = 0;
        if ($ru =~ "~5([^0-9]|$)" || $ru =~ "~6([^0-9]|$)") $var(webrtc) = 1;
        if (handle_ruri_alias()) {
            xlog("L_INFO","SBC-NG alias -> $ru (webrtc=$var(webrtc))\n");
            if (is_method("INVITE")) {
                record_route();
                if ($var(webrtc) == 1) rtpengine_manage("trust-address replace-origin replace-session-connection ICE=force RTP/SAVPF");
                else rtpengine_manage("trust-address replace-origin replace-session-connection");
            }
            route(RELAY);
            exit;
        }
    }

    if (is_method("CANCEL")) { if (t_check_trans()) route(RELAY); exit; }
    t_check_trans();

    remove_hf("Route");
    if (is_method("INVITE|SUBSCRIBE")) record_route();

    # --- NAT (señalización) ---
    force_rport();
    if (nat_uac_test("19") || proto == WS || proto == WSS
        || (is_method("REGISTER") && src_ip != myself && src_ip != @@TRUSTED_NET@@)) {
        set_contact_alias();
    }

    # --- medios: rtpengine ancla el RTP en el INVITE inicial ---
    #
    # RTP/AVP fuerza que hacia la central (Asterisk, RTP plano) SIEMPRE salga RTP/AVP:
    #  - WebRTC (WS/WSS): quita ICE y desencripta DTLS-SRTP.
    #  - Telefonos que ofrecen SDES-SRTP por UDP (m=audio RTP/SAVP + a=crypto): rtpengine
    #    termina el SRTP y ofrece RTP plano; sin esto, Asterisk contesta 488 Not Acceptable.
    #  - Oferta ya en RTP/AVP: es un no-op, no rompe nada.
    # rtpengine hace el interworking en ambos sentidos: la pata del telefono sigue cifrada.
    if (is_method("INVITE") && !has_totag()) {
        if (proto == WS || proto == WSS) rtpengine_manage("trust-address replace-origin replace-session-connection ICE=remove RTP/AVP");
        else rtpengine_manage("trust-address replace-origin replace-session-connection RTP/AVP");
    }

    # --- ENTRANTE: se la mandamos a una de las centrales enganchadas (dispatcher set 1) ---
    #
    # Ojo: por aca no pasa solo lo que viene del operador. Tambien pasa la extension
    # REMOTA que se registro a traves del borde y ahora llama: para el SBC, viene de
    # afuera igual. Por eso las reglas ENTRANTES se aplican aca, y por eso una regla
    # de normalizacion arregla de una vez el numero venga de donde venga.
    route(SIPMANIP_IN);
#!ifdef SBCNG_DIDS
    # ¿el número llamado es un DID con destino propio? (interno de la central o URI directa)
    route(DIDROUTE);
#!endif
#!ifdef SBCNG_STIR_VERIFY
    route(STIRVERIFY);
#!endif
#!ifdef SBCNG_REGISTRAR
    # ¿el destino es un teléfono registrado en el borde? entregáselo directo.
    # Si no está en usrloc, EDGE_LOOKUP hace return y sigue hacia la central.
    route(EDGE_LOOKUP);
#!endif
    if (!ds_select_dst("1", "4")) { send_reply("503", "No hay central disponible"); exit; }
    xlog("L_INFO","SBC-NG $rm de $fU@$si -> $du\n");
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) sl_reply_error();
    exit;
}

onreply_route {
    if (nat_uac_test("1")) set_contact_alias();
    if (has_body("application/sdp")) rtpengine_manage("replace-origin replace-session-connection");

    # --- extensiones SIP que se registran A TRAVES del borde ---
    #
    # El SBC es un proxy de registro: no autentica a nadie ni guarda usuarios, eso lo hace
    # la central. Por eso usrloc esta vacio y no habia nada que listar... salvo que lo
    # anotemos al pasar. Cuando la central contesta 200 a un REGISTER, esa extension existe
    # y esta arriba: la guardamos con la IP REAL de donde vino (la de atras del NAT), el
    # telefono que usa y a que central fue. Es lo que el soporte necesita para contestar
    # "el 1004 dice que no le entran las llamadas".
    if (t_check_status("200") && $rm == "REGISTER" && $fU != "") {
        sql_query("sbc",
            "INSERT INTO sbc_endpoints (aor, usuario, contacto, ip_origen, puerto, transporte, agente, central, last_seen)
             VALUES ('$fU@$fd', '$fU', '$ct', '$si', $sp, '$pr', '$ua', '$Ri', now())
             ON CONFLICT (aor, contacto) DO UPDATE SET ip_origen=EXCLUDED.ip_origen, puerto=EXCLUDED.puerto,
               transporte=EXCLUDED.transporte, agente=EXCLUDED.agente, central=EXCLUDED.central, last_seen=now()");
    }
}

# El control-plane le habla al SBC por acá: jsonrpc sobre HTTP en /RPC.
# (Antes le dejaba recados en una tabla de la base de la central. Eso se murió.)
event_route[xhttp:request] {
    if ($hu =~ "^/RPC") { jsonrpc_dispatch(); exit; }
    # Prometheus: /metrics. Sólo desde la red interna (el control-plane lo scrapea por
    # loopback; Grafana del cliente, desde la LAN). Nunca se expone a internet.
    if ($hu =~ "^/metrics") {
        # 8088 sale por NAT de Docker: filtrar por src_ip no sirve (todo llega del gateway
        # docker). Se protege con un token en la query; el control-plane lo scrapea con el
        # token y re-expone /metrics bajo SU auth (Bearer), que es lo que ve Grafana.
        if ($hu =~ "token=@@METRICS_TOKEN@@") { prom_dispatch(); }
        else { xhttp_reply("403", "Forbidden", "text/plain", "metrics: token requerido\n"); }
        exit;
    }
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (ws_handle_handshake()) exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "no");
}

failure_route[OUTBOUND_FAILOVER] {
    if (t_is_canceled()) exit;
    if (t_check_status("486|408|5[0-9][0-9]")) {
        # Tope duro de saltos de failover. Sin esto, una troncal inalcanzable hacía
        # que el INVITE se re-relayara indefinidamente y —al re-correr la manipulación
        # de cabeceras en cada salto— el mensaje crecía hasta ~70KB y reventaba con
        # "udp_send Message too long" (477). Cinco operadores es más que suficiente.
        $avp(fo_count) = $avp(fo_count) + 1;
        if ($avp(fo_count) > 5) {
            xlog("L_WARN","SBC-NG LCR failover: tope de $avp(fo_count) saltos, corto\n");
            t_reply("503", "Failover limit reached");
            exit;
        }
        if (use_next_gw()) {
            xlog("L_INFO","SBC-NG LCR failover #$avp(fo_count) -> ru=$ru du=$du\n");
            t_on_failure("OUTBOUND_FAILOVER");
            # OJO: NO se re-corre TOPOHIDE ni SIPMANIP acá. La cabecera ya se manipuló
            # (User-Agent, normalización de número, advertised-address) en la rama inicial
            # y tm reutiliza ese buffer; use_next_gw() sólo reescribe R-URI/$du. Re-aplicar
            # la manipulación en cada salto es exactamente lo que apilaba cabeceras y
            # engordaba el INVITE. Sólo re-anclamos medios contra el nuevo operador.
            rtpengine_manage("trust-address replace-origin replace-session-connection");
            route(RELAY);
            exit;
        }
        xlog("L_WARN","SBC-NG LCR failover agotado\n");
    }
}

# Topology hiding: el operador ve al SBC, nunca a la central ni a la red interna.
route[TOPOHIDE] {
    set_advertised_address("@@PUBLIC_IP@@");
    remove_hf("User-Agent");
    append_hf("User-Agent: SBC-NG\r\n");
    remove_hf("X-AST-Orig-Host");
    remove_hf("P-hint");
}

# Manipulación de cabeceras por operador. La escribe el control-plane entre los marcadores.
#=== SBCNG-SIPMANIP START ===
# Las reglas las define el panel (tabla sbc_sip_rules) y el control-plane las traduce
# a este fragmento. El entrypoint garantiza que exista -vacio si no hay reglas- asi
# que Kamailio siempre arranca, con panel o sin panel.
include_file "/etc/kamailio/reglas.cfg"

# Geo-bloqueo por país: define route[GEOBLOCK], que el request_route llama en el ingreso.
# El entrypoint garantiza que exista (route inerte si el panel no configuró nada).
include_file "/etc/kamailio/geoblock.cfg"

route[SIPMANIP] {
    route(SBCNG_REGLAS_SALIENTE);
    return;
}

route[SIPMANIP_IN] {
    route(SBCNG_REGLAS_ENTRANTE);
    return;
}
#=== SBCNG-SIPMANIP END ===
